# 锁写进 gitops/components/<对象>/image.lock.yaml（component-lock）。构建入口：make platform-build OBJECT=<对象>。
---
revision: b23ea80b24c0c3b866bb346277a870028ed58b42
images:
  relay:
    object: relay-platform/relay
    # 3644498b：会合点转发本地 link 报的设备编号、主机名、系统（账 143；现网没转，knowbench 认不出配给账号的那份，账 178）
    revision: 3644498b32de16960a5d415139618bfc57aaf21e
    context: infrastructure/applications/component-images/relay
    dockerfile: Dockerfile
    base: python
    user: relay
    executable: python
    version: Python 3.13.15
  sandbox-provisioner:
    object: sandbox-platform/provisioner
    # 隔离 Skill Job、完整包输入、执行回执及停止确认。
    revision: 7798c101b9c82d5e7f5016fd3706688a4c9d8ca6
    context: infrastructure/applications/component-images/sandbox-platform/provisioner
    dockerfile: Dockerfile
    base: python
    user: provisioner
    executable: python
    version: Python 3.13.15
  sandbox:
    # 只构建、不单独部署的对象：供给器按用户拉起沙箱 Pod 时用它
    object: sandbox-platform/sandbox
    # Codex 0.170.0 与 Link 0.5.9 配套；本次含纯指令流末计量。
    revision: 7798c101b9c82d5e7f5016fd3706688a4c9d8ca6
    context: infrastructure/applications/component-images/sandbox-platform
    dockerfile: image/Dockerfile
    base: node-runtime
    user: codex
    executable: node
    version: v24.21.0
    # 要装 apt 包、pip 包和 Codex 的 npm 包，第一次比别的慢
    timeout_seconds: 3600
