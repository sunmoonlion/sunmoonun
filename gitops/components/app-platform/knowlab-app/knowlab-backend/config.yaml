# 后端数据库、迁移任务、私有路径和容量预算；秘密不入此文件。
---
knowlab_backend_deployment:
  database: knowlab
  database_runtime_user: knowlab_runtime
  database_migrator_user: knowlab_migrator
  database_bootstrap_revision: v2
  migration_job_revision: v1
  # 账 175：本地用户只按 subject 认、合并旧份（20261025_0013）
  expected_schema_revision: '20261025_0013'
  deploy_budget_bytes: 2147483648
  redis_user: knowlab_runtime
  redis_key_pattern: 'knowlab:*'
  redis_identity_revision: v3
  rabbitmq_user: knowlab_runtime
  rabbitmq_vhost: knowlab
  rabbitmq_queue: knowlab.default
  rabbitmq_identity_revision: v2
  identity_organization: built-in
  # 普通用户所在组织（决策 D21、SDD 0014）：网页端应用挂这里；管理端仍在 built-in。
  identity_user_organization: sunmoonai
  # v6：网页端令牌 12 小时（所有者 2026-10-25）；知识库三应用开令牌交换；knowbase 加 audience 目标应用（SDD 0042）
  identity_revision: v6
  # SDD 0042：网页端用用户令牌向 Casdoor 换给 knowbase 的令牌（RFC 8693），Casdoor 要给这个应用开令牌交换授权类型
  identity_token_exchange: true
  # 跨应用跳转（专家孵化方案第十三节第 5 条）：申请页、专家页上能用了的那一版带用户去 knowbench 工作台请它
  cross_app_enabled: true
  # 用户上传的数据只进自己的桶（SDD 0027 决定 4，机制在 common/backend/storage）；桶与身份的名字由机制规定。
  # 未接入 S3 前上传一律不收，不回退到容器本地目录
  object_storage:
    enabled: true
    user: knowlab_storage
    bucket: knowlab-originals
    job_revision: v1
  domain_runtime_env: {STORAGE_BACKEND: s3}
  # 上传的文件超过 1 MB 会先落到 /tmp（单个最大 50 MB），默认 64Mi 不够几个并发
  tmp_size_limit: 256Mi
  domain_env:
    # 登录完能回到「我在做的分身」与「提交一个想法」（SDD 0027 P3，前缀匹配）；其余同模板默认
    # web端各页（SDD 0037：待我回答、创意、分身、专家、我的数据；旧的 /knowbots 转到创意）
    WEB_AUTH_ALLOWED_RETURN_PATHS: '/zh-CN/dashboard,/en/dashboard,/zh-CN/login,/en/login,/zh-CN/knowbots,/en/knowbots,/zh-CN/questions,/en/questions,/zh-CN/ideas,/en/ideas,/zh-CN/avatars,/en/avatars,/zh-CN/experts,/en/experts,/zh-CN/data,/en/data'
    # SDD 0042：用户令牌换给 knowbase 时要的 audience = knowbase 在 Casdoor 里的目标应用
    KNOWBASE_USER_AUDIENCE: sunmoon-kind-knowbase-user-data
    # 数据第四版补采开关（同 knowbench 的 WORKBENCH_DATA_SUPPLY_ENABLED，fail-closed）：测试集里缺的公开披露交 knowfeed
    KNOWLAB_DATA_SUPPLY_ENABLED: 'true'
  # 通用出站服务身份（SDD 0027 P1，机制在 common/backend/service-client）：测试通过后，把分身版本交付给 knowmart 登记。
  service_clients:
    - target: knowmart
      relation: deliver
      enabled: true
      application: sunmoonai-knowlab-knowmart-deliver
      client_id: sunmoon-knowlab-knowmart-deliver
      organization: sunmoon-workload-knowlab-knowmart-deliver
      scope: knowmart:deliver
      job_revision: v1
      token_seconds: 900
    # 管理端后端按草稿的运行方调登记的运行方跑测试（契约 knowbot-test-run/v1，SDD 0027 决定 12）
    - target: knowbench
      relation: testrun
      enabled: true
      application: sunmoonai-knowlab-knowbench-testrun
      client_id: sunmoon-knowlab-knowbench-testrun
      organization: sunmoon-workload-knowlab-knowbench-testrun
      scope: knowbench:testrun
      job_revision: v1
      token_seconds: 900
    # SDD 0042：发起测试时凭本人的测试同意向 knowbase 签测试运行授权，结束、退回、开跑失败时撤（契约 user-data/v1）
    - target: knowbase
      relation: user-data-grant-test
      enabled: true
      application: sunmoonai-knowlab-knowbase-user-data-grant-test
      client_id: sunmoon-knowlab-knowbase-user-data-grant-test
      organization: sunmoon-workload-knowlab-knowbase-user-data-grant-test
      scope: knowbase:user-data-grant-test
      job_revision: v1
      token_seconds: 900
    # SDD 0042 块 3：一次性命令 python -m app.bootstrap.import_datasets 把 knowlab 旧的知识库资料搬进 knowbase 的 knowlab 分区（在 api 进程里跑）。
    # 旧版兼容，随 qwen 这批代码一起删（decisions ⑰，交Fable-gitops 第 3 条）
    - target: knowbase
      relation: user-data-import
      enabled: true
      roles: [api]
      application: sunmoonai-knowlab-knowbase-user-data-import
      client_id: sunmoon-knowlab-knowbase-user-data-import
      organization: sunmoon-workload-knowlab-knowbase-user-data-import
      scope: knowbase:user-data-import
      job_revision: v1
      token_seconds: 900
    # 数据第四版（契约 user-data/v2，SDD 0043）：补采办完后重解析测试集里的资料，凭第四版运行授权读
    - target: knowbase
      relation: user-data-read
      enabled: true
      application: sunmoonai-knowlab-knowbase-user-data-read
      client_id: sunmoon-knowlab-knowbase-user-data-read
      organization: sunmoon-workload-knowlab-knowbase-user-data-read
      scope: knowbase:user-data-read
      job_revision: v1
      token_seconds: 900
    # 数据第四版：推名下专家名录、交付时冻结绑定（SDD 0044 第三节）
    - target: knowbase
      relation: user-data-directory
      enabled: true
      application: sunmoonai-knowlab-knowbase-user-data-directory
      client_id: sunmoon-knowlab-knowbase-user-data-directory
      organization: sunmoon-workload-knowlab-knowbase-user-data-directory
      scope: knowbase:user-data-directory
      job_revision: v1
      token_seconds: 900
    # 数据第四版：替用户写产出区（SDD 0043 第 2.6 节）
    - target: knowbase
      relation: user-data-output
      enabled: true
      application: sunmoonai-knowlab-knowbase-user-data-output
      client_id: sunmoon-knowlab-knowbase-user-data-output
      organization: sunmoon-workload-knowlab-knowbase-user-data-output
      scope: knowbase:user-data-output
      job_revision: v1
      token_seconds: 900
    # 数据第四版：测试集里缺的公开披露向 knowfeed 提需求单、看进度、取消（SDD 0045 第 2.4 节）；knowfeed 按 SUPPLY_SERVICE_APPS_JSON 把它认成 knowlab
    - target: knowfeed
      relation: supply-demand
      enabled: true
      application: sunmoonai-knowlab-knowfeed-supply-demand
      client_id: sunmoon-knowlab-knowfeed-supply-demand
      organization: sunmoon-workload-knowlab-knowfeed-supply-demand
      scope: knowfeed:supply-demand
      job_revision: v1
      token_seconds: 900
    # 孵化栏（专家孵化方案第 8.2、十八节，契约 knowbot-incubation/v1）：「AI 起草」的一轮交 knowbench 跑；入口共用 KNOWBENCH_INTERNAL_URL，只在 api 进程
    - target: knowbench
      relation: incubate
      enabled: true
      roles: [api]
      application: sunmoonai-knowlab-knowbench-incubate
      client_id: sunmoon-knowlab-knowbench-incubate
      organization: sunmoon-workload-knowlab-knowbench-incubate
      scope: knowbench:incubate
      job_revision: v1
      token_seconds: 900
  # 接收运行方读分身绑定的用户数据（SDD 0027 §3.5，契约 knowbot-data/v1）。内部入口在 traefik service-access
  # 的 service_access_routes.knowlab；身份从调用方的 service_clients 推出来，不重复维护。
  service_receivers:
    - {relation: read, caller: knowbench, enabled: true}
    # AI 请专家（decisions 10-29；交Fable-gitops 第 2a 节）：工作台以用户的名义来建「问题」申请
    - {relation: incubation-request, caller: knowbench, enabled: true}
  api_port: 8000
  api_replicas: 1
  worker_replicas: 1
  worker_concurrency: 2
  scheduler_replicas: 1
  resources:
    # 读用户数据时在 API 进程里解析 PDF 与 Excel（单个最大 50 MB，0027 §3.5），上限放宽到 1.5Gi
    api: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '2', memory: 1536Mi}}
    worker: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '2', memory: 1Gi}}
    scheduler: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
  # RabbitMQ 4.3不允许非持久非独占队列；Celery控制/事件队列随连接退出。
  celery_control_queue_exclusive: true
  celery_event_queue_exclusive: true
