# 知识应用运行配置；RAGFlow为派生索引，信息原文以独立只读身份读取。
---
knowbase_backend_deployment:
  database: knowbase
  database_runtime_user: knowbase_runtime
  database_migrator_user: knowbase_migrator
  database_extensions:
  - uuid-ossp
  database_bootstrap_revision: v1
  migration_job_revision: v2
  expected_schema_revision: '20260927_0007'
  deploy_budget_bytes: 2147483648
  redis_user: knowbase_runtime
  redis_key_pattern: knowbase:*
  redis_identity_revision: v2
  rabbitmq_user: knowbase_runtime
  rabbitmq_vhost: knowbase
  rabbitmq_queue: knowbase.default
  rabbitmq_identity_revision: v2
  identity_organization: built-in
  # 普通用户所在组织（决策 D21、SDD 0014）：网页端应用挂这里；管理端仍在 built-in。
  identity_user_organization: sunmoonai
  # v6：网页端令牌 12 小时（所有者 2026-10-25）；知识库三应用开令牌交换；knowbase 加 audience 目标应用（SDD 0042）
  identity_revision: v6
  # SDD 0042：knowbase 在 Casdoor 里的目标应用，只作用户令牌交换的 audience（客户端编号 = 各应用的 KNOWBASE_USER_AUDIENCE、
  # knowbase 的 USER_TOKEN_AUDIENCE）；没人登录它，随身份注册 Job 建
  identity_audience_application: {name: sunmoonai-knowbase-user-data, client_id: sunmoon-kind-knowbase-user-data}
  api_port: 8000
  api_replicas: 1
  worker_replicas: 1
  worker_concurrency: 2
  scheduler_replicas: 1
  resources:
    api:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: '2'
        memory: 768Mi
    worker:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
    scheduler:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
  celery_control_queue_exclusive: true
  celery_event_queue_exclusive: true
  domain_runtime_env: {}
  # 0010：数据集目录、多数据集与语义层（0008-info 段三、0009-semantic）、工具的 JWT 验签
  cross_app_enabled: true
  tmp_size_limit: 2Gi
  domain_env:
    KNOWBASE_MCP_JWT_ISSUER: sunmoon-workbench
    KNOWBASE_MCP_RATE_PER_MINUTE: '120'
    KNOWBASE_DATASET_TITLE: 零售经营库（最小实例）
    KNOWBASE_DATASET_REGISTRY_ENABLED: 'true'
    KNOWBASE_DATASET_ALLOWED_BUCKETS: knowfeed-originals
    KNOWBASE_DATASET_CACHE_DIR: /tmp/knowbase-datasets
    KNOWBASE_SEMANTIC_ENGINE_ENABLED: 'true'
    KNOWBASE_SEMANTIC_CACHE_DIR: /tmp/knowledge-semantic
    # SDD 0042 用户资料：本人令牌的 aud 是 Casdoor 里的目标应用（identity_audience_application）；azp → 分区，只认三家网页端
    USER_TOKEN_AUDIENCE: sunmoon-kind-knowbase-user-data
    USER_TOKEN_APPS_JSON: '{"sunmoon-kind-knowbench-web": "knowbench", "sunmoon-kind-knowlab-web": "knowlab", "sunmoon-kind-knowmart-web": "knowmart"}'
    # 用户资料存自己的桶（机制规定 <应用>-originals，前缀 users/；凭据在 USER_DATA_S3_*，见 object_storage.env_prefix）
    USER_DATA_BUCKET: knowbase-originals
    USER_DATA_PREFIX: users
    # 凭运行授权读的服务身份以哪个应用的名义读（sub = admin/<调用方服务应用>），与下面 service_receivers 一一对应
    USER_DATA_READER_APPS_JSON: '{"admin/sunmoonai-knowbench-knowbase-user-data-read": "knowbench", "admin/sunmoonai-knowlab-knowbase-user-data-grant-test": "knowlab", "admin/sunmoonai-knowlab-knowbase-user-data-import": "knowlab", "admin/sunmoonai-knowmart-knowbase-user-data-purchase": "knowmart"}'
  domain_secrets:
    KNOWBASE_MCP_JWT_PUBLIC_KEY: {source: workbench-signing, key: public_key_pem}
  domain_secrets_roles: [api]
  # 用户的沙箱不再能连 knowbase（2026-10-18 数据拓扑：平台的数到不了用户的沙箱，待办账 111）。
  # 工作台也不再发 knowbase 的 MCP 令牌；集群是 prune: false，旧的 knowbase-sandboxes-in 要精确删除
  domain_ingress: []
  knowledge_provider:
    enabled: true
    dataset_key: default
    dataset_name: sunmoon-kind-knowbase-default
    tenant_id: sunmoonai
    source_user: knowbase_source_reader
    source_bucket: knowfeed-originals
    # 2026-10-06 放宽到 knowfeed/：原文在 knowfeed/original/，登记的数据集文件在 knowfeed/securities/…/datasets/
    source_prefix: knowfeed/
    # v2：前缀放宽后策略要在现网重建一次（Job 按代次命名，不升代次不重跑）
    job_revision: v2

  # SDD 0042 用户资料的桶（机制在 common/backend/storage）：knowbase 的 S3_* 已被知识源只读身份（knowledge_provider）占着，
  # 这个桶的变量名带前缀 USER_DATA_（USER_DATA_S3_ENDPOINT、USER_DATA_S3_ACCESS_KEY_ID……），应用代码按前缀读
  object_storage:
    enabled: true
    user: knowbase_storage
    bucket: knowbase-originals
    job_revision: v1
    env_prefix: USER_DATA_
  # SDD 0042 接收的跨应用服务关系（通用机制 common/backend/service-client）：身份从调用方的 service_clients 推出来
  service_receivers:
    - {relation: user-data-read, caller: knowbench, enabled: true}
    - {relation: user-data-grant-test, caller: knowlab, enabled: true}
    - {relation: user-data-import, caller: knowlab, enabled: true}
    - {relation: user-data-purchase, caller: knowmart, enabled: true}

  knowbase_service_receiver:
    enabled: true
