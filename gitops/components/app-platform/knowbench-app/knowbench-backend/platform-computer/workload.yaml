# 平台电脑（原分身测试的测试电脑，SDD 0027 §3.4；叫法 10-29）：与用户同一份代码的本地代理（Linux 包），一人一台配给名单里的账号。
# 脚本与取包凭据各一份、所有电脑共用；每台一个 Deployment、各自的持久卷
apiVersion: v1
kind: ConfigMap
metadata: {name: knowbench-platform-computer-scripts, namespace: app-platform-dev}
data:
  fetch.sh: |
    # 取钉住的 Linux 包：只读身份从私有桶取、核归档摘要、解开、按清单逐字节核对。已核过的版本不重取
    set -eu
    umask 0077
    target="/data/releases/0.5.3-d93bfc543030"
    if [ ! -f "$target/.verified" ]; then
      rm -rf /data/releases/.incoming
      mkdir -p /data/releases/.incoming/x
      printf 'user = "%s:%s"\n' "$(cat /run/download/access-key)" "$(cat /run/download/secret-key)" > /tmp/curl.conf
      curl -q --config /tmp/curl.conf --fail --silent --show-error --proto '=https' --max-redirs 0 \
        --cacert /run/download/ca.crt --aws-sigv4 "aws:amz:$(cat /run/download/region):s3" \
        -o /data/releases/.incoming/agent.tar.gz \
        "$(cat /run/download/endpoint)/agent-releases/linux-x64/0.5.3/sunmoon-link-0.5.3-b398c1d-linux-x64.tar.gz"
      rm -f /tmp/curl.conf
      echo "d93bfc543030e373fe251f9e36300d807e01b49f5192df0120508c0589f4ead5  /data/releases/.incoming/agent.tar.gz" | sha256sum -c -
      tar -xzf /data/releases/.incoming/agent.tar.gz -C /data/releases/.incoming/x --no-same-owner --no-same-permissions
      node /data/releases/.incoming/x/installer/verify-linux.mjs /data/releases/.incoming/x 60d2471fff0a7d7e1615af32f9ebfafabac9557246ec05bce4ca4237b432ea51
      mv /data/releases/.incoming/x "$target"
      touch "$target/.verified"
      rm -rf /data/releases/.incoming
    fi
    ln -sfn "$target" /data/agent.next && mv -T /data/agent.next /data/agent
  run.sh: |
    # 第一次没有凭据：日志里显示连接码，配给的那位用自己的账号在工作台「接入电脑」里确认；之后直接启动。
    # 这台配给谁、叫什么由 Deployment 的环境变量给（SUNMOON_PLATFORM_ACCOUNT、SUNMOON_PLATFORM_COMPUTER）
    set -eu
    export HOME=/data/home SUNMOON_AGENT_HOME=/data/home/.sunmoon-link
    # 按安装包的方式起代理（同包里 launch.mjs 的 nodeLaunch）：带 --use-system-ca；站点是 edge-public（系统信任），
    # 不许另指证书，所以清掉 NODE_EXTRA_CA_CERTS 与 NODE_OPTIONS。不这样起，代理会以 SITE_LAUNCH 拒绝启动
    unset NODE_EXTRA_CA_CERTS NODE_OPTIONS
    # runs/.tmp 是 TMPDIR（Fable 评审 P2-14）：测试轮次的沙箱排除共用的 /tmp，临时文件落在工作区里；工作台每次开测前会清掉重建它
    mkdir -p "$SUNMOON_AGENT_HOME" "/workspace/底稿" "/workspace/runs/.tmp"
    agent() { node --use-system-ca /data/agent/app/dist/cli.js "$@"; }
    if [ ! -f "$SUNMOON_AGENT_HOME/config.json" ]; then
      agent init --root "/workspace" --no-outer-sandbox --name "$SUNMOON_PLATFORM_COMPUTER"
    fi
    paired() { node -e 'process.exit(require(process.env.SUNMOON_AGENT_HOME + "/config.json").token ? 0 : 1)'; }
    until paired; do
      printf '{"event":"pairing","hint":"用账号 %s 在工作台「接入电脑」里输入下面的连接码"}\n' "$SUNMOON_PLATFORM_ACCOUNT"
      agent pair || sleep 10
    done
    # 测试产出保留 7 天：每小时删一次 7 天前的底稿目录（只动 底稿/对话-*）。每次测试自己的目录 runs/*
    # 由工作台测完就删（账 129），这里只兜底删 7 天没动的
    ( while true; do
        find "/workspace/底稿" -mindepth 1 -maxdepth 1 -type d -name '对话-*' -mtime +7 -exec rm -rf {} + || true
        find "/workspace/runs" -mindepth 1 -maxdepth 1 -type d ! -name .tmp -mtime +7 -exec rm -rf {} + 2>/dev/null || true
        sleep 3600
      done ) &
    exec node --use-system-ca /data/agent/app/dist/cli.js start
---
# knowbot-tester：配给 knowbot-tester，沿用持久卷 knowbench-test-computer
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowbench-test-computer
  namespace: app-platform-dev
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowbench-platform-computer-knowbot-tester, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: knowbench-platform-computer-knowbot-tester}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowbench-platform-computer-knowbot-tester
        app.kubernetes.io/part-of: knowbench
        sunmoonai.com/platform-computer: 'knowbot-tester'
        sunmoonai.com/object-storage-client: 'true'
      annotations:
        sunmoonai.com/agent-package: 'd93bfc543030e373fe251f9e36300d807e01b49f5192df0120508c0589f4ead5'
        # 脚本改了 Pod 就换：ConfigMap 卷不会让在跑的进程重读（R5.3 改 run.sh 后旧 Pod 崩到第 11 次才用上新脚本）
        sunmoonai.com/scripts: '63b9de9d4495582e9c6d5341958b8c34ce5cc1b27deeda2cadfe9cec3b0eac39'
    spec:
      automountServiceAccountToken: false
      # 镜像在 Harbor 的 platform 项目：和沙箱一样显式带拉取凭据（不用运行时的服务账号，平台电脑不需要别的身份）
      imagePullSecrets: [{name: registry-puller}]
      # 平台电脑按公网名经边缘连进来（站点文件 edge-public）。集群的 DNS 最终经 WSL 走到 Windows，而所有者的 Windows hosts 把这些名字指到 127.0.0.1；
      # 只给这个 Pod 把两个名字钉到边缘地址（与下面出站策略放行的是同一个地址），不改集群 DNS
      hostAliases:
        - ip: '43.153.135.74'
          hostnames: ["knowbench.dev.sunmoonai.com", "relay.dev.sunmoonai.com"]
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: fetch
          image: harbor.sunmoonai.com:30443/platform/sandbox@sha256:8fac3fdfb14f9c956d00cc65cb5b45aaa683500d162b3ffba7a3110d63cea720
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /scripts/fetch.sh]
          env: [{name: HOME, value: /tmp}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: download, mountPath: /run/download, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: agent
          image: harbor.sunmoonai.com:30443/platform/sandbox@sha256:8fac3fdfb14f9c956d00cc65cb5b45aaa683500d162b3ffba7a3110d63cea720
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/tini, --, /bin/bash, /scripts/run.sh]
          env:
            - {name: TMPDIR, value: '/workspace/runs/.tmp'}
            - {name: SUNMOON_PLATFORM_COMPUTER, value: 'knowbot-tester'}
            - {name: SUNMOON_PLATFORM_ACCOUNT, value: 'knowbot-tester'}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '2', memory: 2Gi}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: data, mountPath: /workspace, subPath: workspace}
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: knowbench-test-computer}}
        - {name: scripts, configMap: {name: knowbench-platform-computer-scripts, defaultMode: 0555}}
        - {name: download, secret: {secretName: knowbench-platform-computer-download, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
---
# 所有平台电脑共用一条：只放行 DNS、对象存储（取包）与公网边缘的 30443（会合点与网页地址）。模型在该账号的云端沙箱里调，这里不出外网
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbench-platform-computer-egress, namespace: app-platform-dev}
spec:
  podSelector:
    matchExpressions: [{key: sunmoonai.com/platform-computer, operator: Exists}]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: object-storage}}
      ports: [{protocol: TCP, port: 9000}]
    - to:
        - ipBlock: {cidr: 43.153.135.74/32}
      ports: [{protocol: TCP, port: 30443}]
