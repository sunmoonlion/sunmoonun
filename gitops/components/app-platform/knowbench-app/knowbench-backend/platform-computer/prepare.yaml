---
# 平台电脑（原分身测试的测试电脑，SDD 0027 §3.4；叫法 10-29）：在后端准备流程里、发行包准备之后引入（common/backend/prepare.yaml）
- name: Validate the platform computer boundaries
  ansible.builtin.assert:
    quiet: true
    that:
      - application_name == 'knowbench'
      - agent_releases_enabled | bool
      - knowbench_agent_releases.mode == 'object-storage'
      - knowbench_agent_releases.linux is mapping
      - cfg.platform_computers.storage is match('^[1-9][0-9]*Gi$')
      - cfg.platform_computers.workspace == '/workspace'
      - cfg.platform_computers.computers is sequence and cfg.platform_computers.computers is not string
      - cfg.platform_computers.computers | length > 0
- name: Require each platform computer to name itself, its account and (optionally) a plain claim
  ansible.builtin.assert:
    quiet: true
    that:
      - item.name is string and item.name is match('^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$')
      - item.account is string and item.account is match('^[a-z0-9][a-z0-9._-]{0,63}$')
      - item.claim is not defined or (item.claim is string and item.claim is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'))
  loop: '{{ cfg.platform_computers.computers }}'
  loop_control: {label: '{{ item.name | default("?") }}'}
- name: Require distinct computer names and distinct volumes
  ansible.builtin.assert:
    quiet: true
    that:
      - names | unique | length == names | length
      - claims | unique | length == claims | length
  vars:
    names: '{{ cfg.platform_computers.computers | map(attribute="name") | list }}'
    claims: >-
      {%- set out = [] -%}
      {%- for c in cfg.platform_computers.computers -%}
        {%- set _ = out.append(c.claim | default('knowbench-platform-computer-' ~ c.name)) -%}
      {%- endfor -%}
      {{ out }}
- name: Inspect the Linux package publication receipt without following redirects
  ansible.builtin.stat: {path: '{{ services_config_dir }}/knowbench-agent-release-linux-published.json', follow: false}
  register: linux_receipt_path
- name: Require an owned readback receipt for the Linux package
  ansible.builtin.assert:
    quiet: true
    that:
      - linux_receipt_path.stat.isreg | default(false)
      - not linux_receipt_path.stat.islnk | default(false)
      - linux_receipt_path.stat.uid == 0
      - linux_receipt_path.stat.mode == '0600'
    fail_msg: Upload and verify the Linux package (make agent-release-linux-upload) before staging the platform computers.
- name: Read the credential-free Linux publication receipt
  ansible.builtin.slurp: {src: '{{ services_config_dir }}/knowbench-agent-release-linux-published.json'}
  register: linux_receipt
- name: Bind the platform computers to this exact Linux package
  ansible.builtin.assert:
    quiet: true
    that:
      - receipt.readback_verified is sameas true
      - receipt.bucket == knowbench_agent_releases.bucket
      - receipt.key == knowbench_agent_releases.linux.object_key
      - receipt.tarball_sha256 == knowbench_agent_releases.linux.tarball_sha256
      - receipt.manifest_sha256 == knowbench_agent_releases.linux.manifest_sha256
      - receipt.size_bytes == knowbench_agent_releases.linux.size_bytes
  vars: {receipt: '{{ linux_receipt.content | b64decode | from_json }}'}
- name: Read the pinned sandbox image (Node and Codex) and the public edge address
  ansible.builtin.set_fact:
    platform_computer_image: '{{ lookup("file", playbook_dir + "/../../gitops/components/sandbox-platform/sandbox/image.lock.yaml") | from_yaml }}'
    platform_computer_edge_ip: '{{ edge_public_ip }}'
    # 平台电脑按安装包站点文件里的公网名经边缘连进来（Linux 包 edge-public），名字跟站点走（SDD 0039 C2b）
    platform_computer_hostnames: ['{{ "knowbench." + site_domain }}', '{{ relay_origin | urlsplit("hostname") }}']
- name: Require a pinned image digest and an edge address
  ansible.builtin.assert:
    quiet: true
    that:
      - platform_computer_image.digest is match('^sha256:[a-f0-9]{64}$')
      - platform_computer_edge_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - platform_computer_hostnames | length == 2
      - platform_computer_hostnames | select('match', '^[a-z0-9-]+\.' + (site_domain | regex_escape) + '$') | list | length == 2
- name: Prepare platform computer candidate directory
  ansible.builtin.file: {path: '{{ build }}/{{ application_object }}/platform-computer', state: directory, owner: '{{ cluster_operator }}', mode: '0755'}
- name: Encrypt the read-only download input shared by the init containers
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    secret_item:
      file: '{{ application_object }}/platform-computer/download.sops.yaml'
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: knowbench-platform-computer-download, namespace: '{{ app_namespace }}'}
        stringData:
          endpoint: 'https://object-storage.{{ data_namespace }}.svc.cluster.local:{{ object_storage_port }}'
          region: '{{ object_storage_region }}'
          access-key: '{{ knowbench_agent_releases.reader }}'
          secret-key: '{{ agent_release_private.reader_secret }}'
          ca.crt: '{{ agent_release_runtime["ca.crt"] }}'
  no_log: true
- name: Render the platform computers
  ansible.builtin.template:
    src: '{{ component_root }}/platform-computer/workload.yaml.j2'
    dest: '{{ build }}/{{ application_object }}/platform-computer/workload.yaml'
    owner: '{{ cluster_operator }}'
    mode: '0644'
