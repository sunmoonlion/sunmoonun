apiVersion: v1
kind: ConfigMap
metadata: {name: 'knowbench-identity-provision-v6', namespace: app-platform-dev}
data:
  provision.py: |
    """Register the two browser clients through Casdoor's supported API."""
    from datetime import datetime, timezone
    import json
    import os
    from pathlib import Path
    import re
    from urllib.parse import urlsplit

    import httpx

    # RFC 8693. Web clients of the applications that read user data in knowbase trade the user's
    # token for one addressed to knowbase (SDD 0042); Casdoor only allows that for applications
    # carrying this grant type.
    TOKEN_EXCHANGE = 'urn:ietf:params:oauth:grant-type:token-exchange'


    def require(condition, message):
        if not condition:
            raise RuntimeError(message)


    def run():
        origin = os.environ['CASDOOR_ORIGIN']
        endpoint = os.environ['CASDOOR_INTERNAL_ENDPOINT']
        organization = os.environ['CASDOOR_ORGANIZATION']
        # Decision D21 / SDD 0014: people sign in to web clients from one user organization;
        # admin clients stay in built-in, whose every member is a Casdoor global administrator.
        user_organization = os.environ['CASDOOR_USER_ORGANIZATION']
        definitions = json.loads(os.environ['BROWSER_CLIENTS'])
        # Which browser surfaces may trade the user's token (SDD 0042: web of knowbench, knowlab,
        # knowmart), and the token-target application this backend owns (only knowbase). The target
        # application exists so Casdoor has an audience to issue to; nobody signs in to it.
        exchange_surfaces = set(json.loads(os.environ.get('TOKEN_EXCHANGE_SURFACES', '[]')))
        audience_application = json.loads(os.environ.get('AUDIENCE_APPLICATION', 'null'))
        require(exchange_surfaces <= {'web', 'admin'}, 'Unexpected token exchange surfaces')
        secrets = json.loads(Path('/run/app/clients.json').read_text())
        initialization = json.loads(Path('/run/admin/init_data.json').read_text())
        admins = [u for u in initialization['users'] if u['owner'] == 'built-in' and u['name'] == 'admin']
        require(len(admins) == 1 and organization == 'built-in', 'Unexpected administrator or organization')
        require(user_organization == 'sunmoonai', 'Unexpected user organization')
        surface_organization = {'admin': organization, 'web': user_organization}
        require(set(definitions) == {'web', 'admin'}, 'Both browser surfaces are required')
        require(definitions['web']['client_id'] != definitions['admin']['client_id'], 'Browser clients must differ')
        require(secrets['web_secret'] != secrets['admin_secret'], 'Browser secrets must differ')
        created = []
        checked = []
        migrated = []
        sso_migrated = []
        domain_migrated = []
        exchange_migrated = []
        audience_created = []
        with httpx.Client(base_url=endpoint, headers={'Origin': origin}, trust_env=False, timeout=15) as client:
            def api(method, path, payload=None, params=None):
                response = client.request(method, path, json=payload, params=params)
                require(response.status_code == 200, 'Casdoor API HTTP failure')
                result = response.json()
                require(result.get('status') == 'ok', 'Casdoor API rejected operation')
                return result.get('data')

            api('POST', '/api/login', {'application': 'app-built-in', 'organization': 'built-in',
                                     'username': 'admin', 'password': admins[0]['password'], 'type': 'login'})
            baseline = api('GET', '/api/get-application', params={'id': 'admin/app-built-in'})
            require(baseline and baseline['cert'], 'Existing Casdoor signing certificate missing')
            # Every application provisions the same user organization; concurrent jobs may race
            # on creation, so a failed add is accepted only when a re-read shows the exact org.
            desired_org = {'owner': 'admin', 'name': user_organization, 'displayName': 'SunMoonAI',
                           'passwordType': 'bcrypt', 'passwordOptions': ['AtLeast8'],
                           'enableSoftDeletion': False}
            org = api('GET', '/api/get-organization', params={'id': 'admin/' + user_organization})
            if org is None:
                try:
                    api('POST', '/api/add-organization',
                        dict(desired_org, createdTime=datetime.now(timezone.utc).isoformat()))
                    created.append('user_organization')
                except RuntimeError:
                    pass
                org = api('GET', '/api/get-organization', params={'id': 'admin/' + user_organization})
            require(org and all(org.get(k) == v for k, v in desired_org.items()),
                    'Existing user organization differs; explicit migration required')
            # Admin consoles show business pages to roles admin/operator (backend ADMIN_AUTH_ROLE_ALLOWLIST;
            # Casdoor puts role objects into the token's roles claim). Roles live in built-in, shared by all
            # applications: create when missing and add built-in/admin to admin. Additive only: never remove
            # members or change other fields; concurrent jobs may race, so a failed add must re-read as present.
            roles_created = []
            role_members_added = []
            for role_name, members in (('admin', ['built-in/admin']), ('operator', [])):
                role_id = 'built-in/' + role_name
                role = api('GET', '/api/get-role', params={'id': role_id})
                if role is None:
                    try:
                        api('POST', '/api/add-role', {'owner': 'built-in', 'name': role_name, 'displayName': role_name,
                                                      'description': 'sunmoon:admin-console-role:managed-by-gitops',
                                                      'users': members, 'groups': [], 'roles': [], 'domains': [],
                                                      'isEnabled': True,
                                                      'createdTime': datetime.now(timezone.utc).isoformat()})
                        roles_created.append(role_name)
                    except RuntimeError:
                        pass
                    role = api('GET', '/api/get-role', params={'id': role_id})
                require(role and role.get('isEnabled') is True, 'Admin console role missing or disabled')
                missing = [m for m in members if m not in (role.get('users') or [])]
                if missing:
                    api('POST', '/api/update-role', dict(role, users=(role.get('users') or []) + missing),
                        params={'id': role_id})
                    role = api('GET', '/api/get-role', params={'id': role_id})
                    role_members_added.append(role_name)
                require(all(m in (role.get('users') or []) for m in members), 'Admin console role members missing')
            for surface, config in definitions.items():
                for name in ('name', 'client_id'):
                    require(re.fullmatch(r'[a-z][a-z0-9-]{2,79}', config[name]), 'Invalid browser identity')
                frontend = urlsplit(config['origin'])
                require(frontend.scheme == 'https' and frontend.hostname and not frontend.username and
                        not frontend.password and not frontend.query and not frontend.fragment and frontend.path in ('', '/'),
                        'Frontend origin must be an exact HTTPS origin')
                callback = config['origin'] + '/api/auth/' + surface + '/callback'
                # SDD 0027: web clients share Casdoor's sign-in session (single sign-on); admin clients
                # do not. Both register the logout landing next to the callback: Casdoor redirects
                # back after logout only to a registered URI.
                single_sign_on = surface == 'web'
                desired = {
                    'owner': 'admin', 'name': config['name'], 'organization': surface_organization[surface],
                    'description': 'sunmoon:knowbench:' + surface + ':managed-by-gitops',
                    'displayName': 'SunMoon template ' + surface, 'category': 'Default', 'type': 'Web',
                    'clientId': config['client_id'], 'clientSecret': secrets[surface + '_secret'],
                    'redirectUris': [callback, config['origin'] + '/api/auth/' + surface + '/logged-out'],
                    'homepageUrl': config['origin'], 'cert': baseline['cert'],
                    'grantTypes': ['authorization_code'] + ([TOKEN_EXCHANGE] if surface in exchange_surfaces else []),
                    'tokenFormat': 'JWT', 'tokenSigningMethod': 'RS256',
                    # Owner 2026-10-25: a web token lives as long as the Casdoor session (12 h), so a
                    # user is not sent back to sign in every hour when the backend trades it for
                    # knowbase; admin consoles keep one hour.
                    'expireInHours': 12 if surface == 'web' else 1, 'refreshExpireInHours': 0,
                    'enablePassword': True, 'enableSignUp': False, 'enableGuestSignin': False,
                    'enableSigninSession': single_sign_on, 'enableAutoSignin': single_sign_on, 'isShared': False,
                    'signinMethods': [{'name': 'Password', 'displayName': 'Password', 'rule': 'All'}],
                }
                existing = api('GET', '/api/get-application', params={'id': 'admin/' + config['name']})
                if existing is None:
                    # Check client-ID collision before creating; never change another application.
                    applications = api('GET', '/api/get-applications', params={'owner': 'admin'})
                    require(not any(a.get('clientId') == config['client_id'] for a in applications), 'Client ID belongs to another application')
                    added = api('POST', '/api/add-application', dict(desired, createdTime=datetime.now(timezone.utc).isoformat()))
                    require(added == 'Affected', 'Application was not created')
                    created.append(surface)
                    existing = api('GET', '/api/get-application', params={'id': 'admin/' + config['name']})
                drift = {k for k, v in desired.items() if existing.get(k) != v}
                if drift == {'organization'} and surface == 'web' and existing.get('organization') == organization:
                    # First allowed migration: a web client registered before SDD 0014 moves
                    # from built-in to the user organization.
                    moved = api('POST', '/api/update-application', dict(existing, organization=user_organization),
                                params={'id': 'admin/' + config['name'], 'columns': 'organization'})
                    require(moved == 'Affected', 'Web application was not moved')
                    migrated.append(surface)
                    existing = api('GET', '/api/get-application', params={'id': 'admin/' + config['name']})
                # SDD 0027: the second allowed migration, only from the exact previous shape (callback
                # only, no sign-in session): turn on single sign-on for web and register the logout
                # landing. Anything else still stops.
                sso_keys = {'redirectUris', 'enableSigninSession', 'enableAutoSignin'}
                drift = {k for k, v in desired.items() if existing.get(k) != v}
                if (drift and drift <= sso_keys and existing.get('redirectUris') == [callback]
                        and existing.get('enableSigninSession') is False and not existing.get('enableAutoSignin')):
                    changed = api('POST', '/api/update-application', dict(existing, **{k: desired[k] for k in drift}),
                                  params={'id': 'admin/' + config['name']})
                    require(changed == 'Affected', 'Single sign-on settings were not applied')
                    sso_migrated.append(surface)
                    existing = api('GET', '/api/get-application', params={'id': 'admin/' + config['name']})
                # SDD 0039 C2b: the third allowed migration, only when the site domain changed. The
                # registered origin (homepageUrl) must be another exact HTTPS origin, and swapping it for
                # the new origin in every registered redirect URI must give exactly the desired list.
                # Client ID, secret, organization and every other field must already match.
                domain_keys = {'redirectUris', 'homepageUrl'}
                drift = {k for k, v in desired.items() if existing.get(k) != v}
                old_origin = existing.get('homepageUrl') or ''
                old = urlsplit(old_origin)
                moved_uris = [config['origin'] + u[len(old_origin):] if u.startswith(old_origin + '/') else u
                              for u in existing.get('redirectUris') or []]
                if (drift and drift <= domain_keys and old_origin != config['origin']
                        and old.scheme == 'https' and old.hostname and not old.username and not old.password
                        and old.path in ('', '/') and not old.query and not old.fragment
                        and moved_uris == desired['redirectUris']):
                    changed = api('POST', '/api/update-application', dict(existing, **{k: desired[k] for k in drift}),
                                  params={'id': 'admin/' + config['name']})
                    require(changed == 'Affected', 'Site domain move was not applied')
                    domain_migrated.append(surface)
                    existing = api('GET', '/api/get-application', params={'id': 'admin/' + config['name']})
                # SDD 0042 / owner 2026-10-25: the fourth allowed migration, only from the pre-0042
                # shape (authorization code only, one-hour tokens): add the token exchange grant and
                # the longer web token. Everything else must already match.
                exchange_keys = {'grantTypes', 'expireInHours'}
                drift = {k for k, v in desired.items() if existing.get(k) != v}
                if (drift and drift <= exchange_keys and existing.get('grantTypes') == ['authorization_code']
                        and existing.get('expireInHours') == 1):
                    changed = api('POST', '/api/update-application', dict(existing, **{k: desired[k] for k in drift}),
                                  params={'id': 'admin/' + config['name']})
                    require(changed == 'Affected', 'Token exchange settings were not applied')
                    exchange_migrated.append(surface)
                    existing = api('GET', '/api/get-application', params={'id': 'admin/' + config['name']})
                require(existing and all(existing.get(k) == v for k, v in desired.items()),
                        'Existing browser application differs; explicit migration required')
                checked.append(surface)
            if audience_application:
                # The token-target application (knowbase): no grant type, no redirect, sign-in
                # disabled. Its client ID is the `aud` the exchanging backends ask for and knowbase
                # checks. The secret is random and thrown away: nothing can be done with it.
                for name in ('name', 'client_id'):
                    require(re.fullmatch(r'[a-z][a-z0-9-]{2,79}', audience_application[name]), 'Invalid audience identity')
                desired_audience = {
                    'owner': 'admin', 'name': audience_application['name'], 'organization': user_organization,
                    'description': 'sunmoon:knowbench:user-token-audience:managed-by-gitops',
                    'displayName': 'SunMoon knowbench user data', 'category': 'Default', 'type': 'Web',
                    'clientId': audience_application['client_id'], 'cert': baseline['cert'],
                    # Casdoor rewrites an empty grant list to the authorization code grant (checked on
                    # 4.12.0); with no redirect URI and sign-in disabled that flow cannot complete.
                    'grantTypes': ['authorization_code'], 'redirectUris': [], 'tokenFormat': 'JWT', 'tokenSigningMethod': 'RS256',
                    'expireInHours': 12, 'refreshExpireInHours': 0,
                    'enablePassword': False, 'enableSignUp': False, 'enableGuestSignin': False,
                    'enableSigninSession': False, 'enableAutoSignin': False, 'isShared': False,
                }
                existing = api('GET', '/api/get-application', params={'id': 'admin/' + audience_application['name']})
                if existing is None:
                    applications = api('GET', '/api/get-applications', params={'owner': 'admin'})
                    require(not any(a.get('clientId') == audience_application['client_id'] for a in applications),
                            'Client ID belongs to another application')
                    added = api('POST', '/api/add-application',
                                dict(desired_audience, clientSecret=os.urandom(24).hex(),
                                     createdTime=datetime.now(timezone.utc).isoformat()))
                    require(added == 'Affected', 'Audience application was not created')
                    audience_created.append(audience_application['client_id'])
                    existing = api('GET', '/api/get-application', params={'id': 'admin/' + audience_application['name']})
                require(existing and all(existing.get(k) == v for k, v in desired_audience.items()),
                        'Existing audience application differs; explicit migration required')
            response = client.get('/.well-known/openid-configuration')
            require(response.status_code == 200, 'OIDC discovery failed')
            discovery = response.json()
            require(discovery['issuer'] == origin and 'S256' in discovery.get('code_challenge_methods_supported', []),
                    'Unexpected issuer or missing PKCE')
            for field in ('authorization_endpoint', 'token_endpoint', 'jwks_uri'):
                value = urlsplit(discovery[field])
                require(value.scheme + '://' + value.netloc == origin, 'OIDC endpoint origin mismatch')
            response = client.get(urlsplit(discovery['jwks_uri']).path)
            require(response.status_code == 200 and response.json().get('keys'), 'OIDC verification keys missing')
        print(json.dumps({'browser_clients': sorted(checked), 'created': created, 'migrated': migrated,
                          'single_sign_on_migrated': sso_migrated, 'domain_migrated': domain_migrated, 'single_sign_on': ['web'],
                          'token_exchange': sorted(exchange_surfaces), 'token_exchange_migrated': exchange_migrated,
                          'audience_application': audience_application['client_id'] if audience_application else None,
                          'audience_created': audience_created,
                          'admin_roles_created': roles_created, 'admin_role_members_added': role_members_added,
                          'user_organization': user_organization, 'admin_organization': organization,
                          'distinct_identities': True, 'exact_redirects': True, 'client_secrets_match': True,
                          'authorization_code_only': True, 'signup_disabled': True,
                          'issuer': origin, 'pkce_s256': True, 'jwks_available': True,
                          'full_browser_login_verified': False}))


    if __name__ == '__main__':
        try:
            run()
        except Exception as error:
            # Only our fixed validation messages are safe; never stringify HTTP exceptions.
            message = str(error) if type(error) is RuntimeError else type(error).__name__
            raise SystemExit('Casdoor registration failed: ' + message)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbench-identity-provision-in, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowbench-identity-provision}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbench-identity-provision-out, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowbench-identity-provision}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: batch/v1
kind: Job
# Job 名带后端镜像摘要（和迁移 Job 一样）：Job 的模板不可改，镜像一换名字就换，不必手动升代次
metadata: {name: 'knowbench-identity-309d4b37e49c-v6', namespace: app-platform-dev}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: {app.kubernetes.io/name: knowbench-identity-provision, app.kubernetes.io/part-of: knowbench}
    spec:
      restartPolicy: Never
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provision
          image: harbor.sunmoonai.com:30443/platform/knowbench-backend@sha256:309d4b37e49c5115a12d54d90d893cd3b47e46a5451301761548e9ea17793972
          imagePullPolicy: IfNotPresent
          command: [python, /script/provision.py]
          env:
            - {name: CASDOOR_INTERNAL_ENDPOINT, value: 'http://casdoor.app-platform-dev.svc.cluster.local:8000'}
            - {name: CASDOOR_ORIGIN, value: 'https://casdoor.dev.sunmoonai.com:30443'}
            - {name: CASDOOR_ORGANIZATION, value: 'built-in'}
            - {name: CASDOOR_USER_ORGANIZATION, value: 'sunmoonai'}
            - name: BROWSER_CLIENTS
              value: "{\"web\": {\"name\": \"sunmoonai-knowbench-web\", \"client_id\": \"sunmoon-kind-knowbench-web\", \"origin\": \"https://knowbench.dev.sunmoonai.com:30443\"}, \"admin\": {\"name\": \"sunmoonai-knowbench-admin\", \"client_id\": \"sunmoon-kind-knowbench-admin\", \"origin\": \"https://knowbench-admin.dev.sunmoonai.com:30443\"}}"
            # SDD 0042：读 knowbase 用户资料的应用，网页端可以用用户令牌换给 knowbase 的令牌；knowbase 自己带一个只作 audience 的目标应用
            - {name: TOKEN_EXCHANGE_SURFACES, value: "[\"web\"]"}
            - {name: AUDIENCE_APPLICATION, value: "null"}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: '1', memory: 256Mi}}
          volumeMounts:
            - {name: script, mountPath: /script, readOnly: true}
            - {name: admin, mountPath: /run/admin, readOnly: true}
            - {name: app, mountPath: /run/app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: script, configMap: {name: 'knowbench-identity-provision-v6'}}
        - {name: admin, secret: {secretName: casdoor-initial-identity, items: [{key: init_data.json, path: init_data.json}], defaultMode: 0440}}
        - {name: app, secret: {secretName: knowbench-identity-provision, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: knowbench-browser-identity, namespace: app-platform-dev}
data:
  CASDOOR_ENDPOINT: 'https://casdoor.dev.sunmoonai.com:30443'
  CASDOOR_ORGANIZATION: 'built-in'
  WEB_CASDOOR_ORGANIZATIONS: 'sunmoonai'
  # 管理端业务页给 admin、operator 两个角色看（待办 98）；角色由注册脚本在 built-in 里建好
  ADMIN_AUTH_ROLE_ALLOWLIST: 'admin,operator'
  WEB_CASDOOR_APPLICATION: 'sunmoonai-knowbench-web'
  WEB_CASDOOR_CLIENT_ID: 'sunmoon-kind-knowbench-web'
  WEB_CASDOOR_REDIRECT_URI: 'https://knowbench.dev.sunmoonai.com:30443/api/auth/web/callback'
  WEB_FRONTEND_BASE_URL: 'https://knowbench.dev.sunmoonai.com:30443'
  WEB_FRONTEND_ALLOWED_ORIGINS: 'https://knowbench.dev.sunmoonai.com:30443'
  ADMIN_CASDOOR_APPLICATION: 'sunmoonai-knowbench-admin'
  ADMIN_CASDOOR_CLIENT_ID: 'sunmoon-kind-knowbench-admin'
  ADMIN_CASDOOR_REDIRECT_URI: 'https://knowbench-admin.dev.sunmoonai.com:30443/api/auth/admin/callback'
  ADMIN_FRONTEND_BASE_URL: 'https://knowbench-admin.dev.sunmoonai.com:30443'
  ADMIN_FRONTEND_ALLOWED_ORIGINS: 'https://knowbench-admin.dev.sunmoonai.com:30443'
